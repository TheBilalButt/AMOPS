name: amops
description: "AMOPS - Autonomous Military Operations Platform System for HIT & MHIL"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.6
  
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.3

  # Supabase
  supabase_flutter: ^2.12.4
  
  # Local Storage
  sqflite: ^2.4.1
  shared_preferences: ^2.5.2
  path: ^1.9.1
  
  # UI and Charts
  fl_chart: ^0.70.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
